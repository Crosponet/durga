spring.application.name=durga
# Required: an existing dedicated checkout with an initial commit and configured upstream.
durga.tasks.repository=${DURGA_TASKS_REPOSITORY:}
durga.tasks.order-file=data/task-order.json
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=durga
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=Durga exposes task investigation operations. Read/list/search before mutations and pass the returned revision as expectedRevision. Use refresh_tasks for explicit remote synchronization. Conflicts require reload; never retry blind writes.
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
