<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Durga - Suivi d'investigations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>Durga</h1>
        <p>Suivi des investigations client</p>
    </header>

    <main>
        <div id="status-message" class="status-message" hidden></div>
        <div class="content-layout">
            <aside class="filter-panel" aria-labelledby="filters-title">
                <section class="calendar-panel" aria-labelledby="calendar-title">
                    <div class="calendar-header">
                        <h2 id="calendar-title">Réunions</h2>
                        <button id="add-meeting" class="button button-primary calendar-add"
                                type="button">Ajouter</button>
                    </div>
                    <div class="calendar-navigation">
                        <button id="previous-week" type="button" aria-label="Semaine précédente">‹</button>
                        <strong id="calendar-range"></strong>
                        <button id="next-week" type="button" aria-label="Semaine suivante">›</button>
                    </div>
                    <div class="calendar-today-row">
                        <button id="calendar-today" class="calendar-today" type="button">Aujourd'hui</button>
                    </div>
                    <div id="calendar" class="calendar" aria-live="polite"></div>
                </section>
                <div class="filter-header">
                    <h2 id="filters-title">Filtres</h2>
                    <button id="reset-filters" class="reset-filters" type="button">
                        Réinitialiser
                    </button>
                </div>
                <label class="filter-field" for="status-filter">
                    <span>Statut</span>
                    <select id="status-filter">
                        <option value="">Tous les statuts</option>
                        <option value="DATA_GRABBING">Collecte de données</option>
                        <option value="INVESTIGATION">Investigation</option>
                        <option value="FIXING">Correction</option>
                        <option value="REPORT">Rapport</option>
                    </select>
                </label>
                <label class="filter-field" for="work-status-filter">
                    <span>État de travail</span>
                    <select id="work-status-filter">
                        <option value="">Tous les états</option>
                        <option value="TODO">À faire</option>
                        <option value="ON IT">En cours</option>
                        <option value="PAUSE">En pause</option>
                        <option value="FINISHED">Terminée</option>
                    </select>
                </label>
                <label class="filter-field" for="server-filter">
                    <span>Serveur</span>
                    <select id="server-filter">
                        <option value="">Tous les serveurs</option>
                    </select>
                </label>
                <p id="filter-count" class="filter-count" aria-live="polite"></p>
            </aside>
            <section class="task-section" aria-labelledby="tasks-title">
                <h2 id="tasks-title" class="visually-hidden">Tâches</h2>
                <div id="task-list" class="task-list"></div>
            </section>
        </div>
    </main>

    <div id="block-overlay" class="block-overlay" hidden></div>

    <div id="task-modal" class="modal" hidden>
        <div class="modal-backdrop" data-close-modal></div>
        <section class="modal-dialog" role="dialog" aria-modal="true"
                 aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 id="modal-title">Détail de la tâche</h2>
                <button id="modal-close" class="modal-close" type="button"
                        aria-label="Fermer">×</button>
            </div>
            <div id="modal-content" class="modal-content"></div>
        </section>
    </div>

    <div id="meeting-modal" class="modal" hidden>
        <div class="modal-backdrop" data-close-meeting-modal></div>
        <section class="modal-dialog" role="dialog" aria-modal="true"
                 aria-labelledby="meeting-modal-title">
            <div class="modal-header">
                <h2 id="meeting-modal-title">Ajouter une réunion</h2>
                <button id="meeting-modal-close" class="modal-close" type="button"
                        aria-label="Fermer">×</button>
            </div>
            <div id="meeting-modal-content" class="modal-content"></div>
        </section>
    </div>

    <div id="milestone-modal" class="modal" hidden>
        <div class="modal-backdrop" data-close-milestone-modal></div>
        <section class="modal-dialog" role="dialog" aria-modal="true"
                 aria-labelledby="milestone-modal-title">
            <div class="modal-header">
                <h2 id="milestone-modal-title">Ajouter un jalon</h2>
                <button id="milestone-modal-close" class="modal-close" type="button"
                        aria-label="Fermer">×</button>
            </div>
            <div class="modal-content">
                <form id="milestone-form" class="task-form">
                    <label>Jalon<textarea name="text" rows="3" required></textarea></label>
                    <p class="form-error" role="alert" hidden></p>
                    <div class="form-actions">
                        <button class="button button-primary" type="submit">OK</button>
                    </div>
                </form>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
